intake_client_brief:
  description: >
    Parse the client brief for project {project_name}.

    Client brief:
    {client_brief}

    List assumptions, open questions, and constraints. Identify MVP vs
    post-MVP scope for the Flutter mobile app described in the client brief
    (e.g. blog, portal, shop — do NOT assume ecommerce unless the brief says so).
  expected_output: >
    Structured intake summary with assumptions, open questions, MVP scope,
    and post-MVP backlog items in markdown.
  agent: product_manager

write_prd:
  description: >
    Using the intake summary and client brief, write a Product Requirements
    Document (PRD) for {project_name}.

    Include:
    - Executive summary
    - User personas
    - User stories with acceptance criteria (Given/When/Then)
    - MVP feature list prioritized for the product type in the client brief
    - Non-functional requirements (performance, security, offline)
    - Out of scope items

    Client brief: {client_brief}
  expected_output: >
    Complete PRD in markdown with numbered user stories and acceptance criteria.
  agent: product_manager
  context:
    - intake_client_brief

domain_review:
  description: >
    Review the PRD against mobile UX best practices for the product domain
    implied by the client brief (blog, portal, shop, etc.).

    Validate the core user journeys from the brief — auth, primary content/workflow,
    navigation, and account/settings. Only include catalog/cart/checkout checks
    when the brief is for a shopping app.

    Incorporate any critical gaps into the final requirements document.
  expected_output: >
    Final requirements document merging PRD content with domain review notes
    and any required story additions or corrections.
  agent: ecommerce_advisor
  context:
    - write_prd
