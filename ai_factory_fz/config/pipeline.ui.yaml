# UI-driven runs from ai_factory_ui (React console). Auto-approves gates; no release/docker emulator.
# Tuned for a fast local demo: small Flutter MVP that can reach build quickly.

phases:
  discovery: true
  planning: true
  design: true
  build: true
  release: false

scope:
  guidance: >
    SPEED DEMO. Deliver the smallest runnable Flutter MVP only.
    Must-have screens: product list (browse) and product detail. Optional: simple cart in memory.
    NO auth, NO payments, NO checkout, NO backend API work in M1 if it slows delivery —
    prefer a local/mock catalog in the Flutter app so the app runs on an emulator immediately.
    NEVER create work items that require human approval, stakeholder sign-off, or "style approval".
    Style tokens may be chosen by the agent without waiting. Start coding in the first build items.
  max_user_stories: 3
  max_work_items: 5
  max_milestones: 1
  max_api_operations: 4
  max_screens: 3

build:
  milestones: []
  sandbox: local
  check_fix_attempts: 1
  agent_timeout_s: 900

gates:
  prd: true
  architecture: true
  release: false

gate_mode: auto

limits:
  clarification_rounds: 1
  gate_rejections: 2
  qa_fix_rounds: 1

# No hard stop on tokens — coding agents (esp. Flutter WI loops) routinely exceed 1M.
budget:
  max_total_tokens: null
